{% extends "base.html" %}{% block title %}Party Planner{% endblock %}{% block content %}<div class="pagehead"><div><span class="eyebrow">PARTY PLANNER</span><h1>Plan your event</h1><p>Tell us the budget, guests and event type.</p></div></div><form id="f" class="card form"><label>Budget ₹<input id="budget" type="number" min="1" required></label><label>Guests<input id="guests" type="number" min="1" required></label><label>Event type<input id="event_type" placeholder="Birthday" required></label><label>Venue<input id="venue" placeholder="Home / hall / hotel"></label><label>Preferences<textarea id="preferences"></textarea></label><button class="btn">Generate Plan</button></form><div id="result"></div>{% endblock %}{% block scripts %}<script>f.onsubmit=async e=>{e.preventDefault();await submitPlanner('/api/generate-party',{budget:+budget.value,guests:+guests.value,event_type:event_type.value,venue:venue.value,preferences:preferences.value})}</script>{% endblock %}
