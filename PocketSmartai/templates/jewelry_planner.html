{% extends "base.html" %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<div class="pagehead"><div><span class="eyebrow">JEWELRY PLANNER</span><h1>Match jewelry to your occasion</h1><p>Optionally upload an outfit image for multimodal analysis.</p></div></div><form id="f" class="card form" enctype="multipart/form-data"><label>Budget ₹<input name="budget" type="number" min="1" required></label><label>Occasion<input name="occasion" placeholder="Wedding" required></label><label>Style<input name="style" value="traditional"></label><label>Outfit description<textarea name="outfit_description" placeholder="Purple saree..."></textarea></label><label>Preferences<textarea name="preferences"></textarea></label><label>Outfit image<input name="outfit_image" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="btn">Generate Plan</button></form><div id="result"></div>{% endblock %}{% block scripts %}<script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/generate-jewelry',{method:'POST',body:new FormData(f)}),d=await r.json();if(r.ok)renderRecommendations(d);else showError(d.detail||'Failed')}</script>{% endblock %}
