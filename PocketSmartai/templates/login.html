{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}<div class="auth card"><h1>Welcome back</h1><form id="f"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="btn">Login</button></form><p id="m"></p><p>New user? <a href="/register">Create account</a></p></div>{% endblock %}{% block scripts %}<script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();if(r.ok)location='/dashboard';else m.textContent=d.detail||'Login failed'}</script>{% endblock %}
