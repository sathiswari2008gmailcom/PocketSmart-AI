{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}<div class="auth card"><h1>Create account</h1><form id="f"><label>Username<input name="username" minlength="3" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required></label><button class="btn">Register</button></form><p id="m"></p><p>Already have an account? <a href="/login">Login</a></p></div>{% endblock %}{% block scripts %}<script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();m.textContent=d.detail||d.message;if(r.ok)location='/login'}</script>{% endblock %}
