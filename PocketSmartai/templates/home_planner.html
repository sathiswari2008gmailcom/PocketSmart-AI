{% extends "base.html" %}{% block title %}Home Planner{% endblock %}{% block content %}<div class="pagehead"><div><span class="eyebrow">HOME PLANNER</span><h1>Plan your home</h1><p>Enter budget, rooms and required items.</p></div></div><form id="f" class="card form"><label>Budget ₹<input id="budget" type="number" min="1" required></label><label>Rooms<input id="rooms" placeholder="Living Room, Bedroom" required></label><label>Style<input id="style" value="modern"></label><h3>Items</h3><div id="items"><div class="row"><input class="name" placeholder="Ceiling light" required><input class="qty" type="number" min="1" value="1" required><input class="notes" placeholder="Notes"></div></div><button type="button" class="btn secondary" onclick="addItem()">+ Add item</button><button class="btn">Generate Plan</button></form><div id="result"></div>{% endblock %}{% block scripts %}<script>function addItem(){items.insertAdjacentHTML('beforeend','<div class="row"><input class="name" placeholder="Item" required><input class="qty" type="number" min="1" value="1" required><input class="notes" placeholder="Notes"></div>')}f.onsubmit=async e=>{e.preventDefault();let its=[...document.querySelectorAll('.row')].map(r=>({name:r.querySelector('.name').value,quantity:+r.querySelector('.qty').value,notes:r.querySelector('.notes').value}));await submitPlanner('/api/generate-home',{budget:+budget.value,rooms:rooms.value.split(',').map(x=>x.trim()).filter(Boolean),style:style.value,items:its})}</script>{% endblock %}
