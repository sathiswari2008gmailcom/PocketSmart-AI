{% extends "base.html" %}{% block title %}History{% endblock %}{% block content %}<h1>Recommendation History</h1><div id="history" class="card">Loading...</div>{% endblock %}{% block scripts %}<script>(async()=>{let r=await fetch('/api/history'),d=await r.json();history.innerHTML=d.length?d.map(x=>`<a class="history" href="/recommendations/${x.id}"><b>${x.planner_type.toUpperCase()}</b><span>${new Date(x.created_at).toLocaleString()}</span>View →</a>`).join(''):'<p>No recommendations yet.</p>'})()</script>{% endblock %}
